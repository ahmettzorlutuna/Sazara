name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd /opt/sazara/site
            echo "== Current commit =="
            git rev-parse --short HEAD
            echo "== Git auth config (diagnostic) =="
            git config --list --show-origin | grep -iE "credential|insteadof|extraheader|url\." || echo "(none)"
            echo "== Fetching =="
            # Repo public: fetch needs no credentials. An inherited credential
            # helper made git try to authenticate anyway, and with no TTY to
            # prompt on it died with "could not read Username". Empty helper
            # plus GIT_TERMINAL_PROMPT=0 keeps it anonymous and fails loudly.
            GIT_TERMINAL_PROMPT=0 git -c credential.helper= fetch origin main
            echo "== Resetting to origin/main =="
            git reset --hard origin/main
            echo "== New commit =="
            git rev-parse --short HEAD
            echo "== Restarting WordPress container =="
            docker restart sazara-wp
            echo "== Done =="
